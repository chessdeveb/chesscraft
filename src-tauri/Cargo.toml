[package]
name = "chesscraft"
version = "0.2.0"
description = "ChessCraft - gestionnaire de parties d'echecs"
authors = ["ChessCraft"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chesscraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
pgn-reader = "0.29.0"
tauri-plugin-dialog = "2.7.2"
# Mises a jour beta-testeurs (menu Aide) : verifie/telecharge/installe une
# nouvelle version depuis le manifeste JSON publie sur le depot public
# separe chesscraft-releases (voir tauri.conf.json, plugins.updater). Pas
# besoin de tauri-plugin-process pour relancer l'appli : sur Windows,
# Update::downloadAndInstall lance l'installeur MSI puis quitte l'appli
# elle-meme.
tauri-plugin-updater = "2"
# Liste des joueurs FIDE (Fichier > Preferences, panneau "Joueurs FIDE") :
# ureq plutot que reqwest -- l'appli est deja entierement synchrone (pas de
# runtime async ailleurs, le travail de fond passe par std::thread::spawn,
# voir bulk_import_pgn), ureq evite d'introduire tokio juste pour un
# telechargement occasionnel.
ureq = "2"
zip = "2"

