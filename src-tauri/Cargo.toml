[package]
name = "chesscraft"
version = "1.3.1"
description = "ChessCraft - gestionnaire de parties d'echecs"
authors = ["ChessCraft"]
edition = "2021"
# GPL-3.0-or-later : impose par shakmaty/pgn-reader (voir Cargo.lock),
# utilises dans tout le backend (regles d'echecs, parsing PGN).
license = "GPL-3.0-or-later"
# `tauri dev` invoque `cargo run` en interne sans --bin : depuis l'ajout du
# binaire normalize_sans (src/bin/), cargo ne pouvait plus deviner lequel
# lancer par defaut et `tauri dev` echouait. normalize_sans reste lancable
# explicitement via `cargo run --bin normalize_sans -- ...`.
default-run = "chesscraft"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chesscraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.30.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
pgn-reader = "0.29.0"
tauri-plugin-dialog = "2.7.2"
# Mises a jour beta-testeurs (menu Aide) : verifie/telecharge/installe une
# nouvelle version depuis le manifeste JSON (latest.json) joint a la derniere
# version publiee sur GitHub (voir tauri.conf.json, plugins.updater). Pas
# besoin de tauri-plugin-process pour relancer l'appli : sur Windows,
# Update::downloadAndInstall lance l'installeur MSI puis quitte l'appli
# elle-meme.
tauri-plugin-updater = "2"
# Liste des joueurs FIDE (Fichier > Preferences, panneau "Joueurs FIDE") :
# ureq plutot que reqwest -- l'appli est deja entierement synchrone (pas de
# runtime async ailleurs, le travail de fond passe par std::thread::spawn,
# voir bulk_import_pgn), ureq evite d'introduire tokio juste pour un
# telechargement occasionnel.
ureq = "2"
zip = "2"
# Telechargement de la megabase (voir megabase.rs) : archive .zst verifiee
# par SHA-256 avant decompression. Deja presents dans Cargo.lock (dependances
# de zip), memes versions.
zstd = "0.13"
sha2 = "0.10"

# Desactive les raccourcis clavier "navigateur" par defaut de WebView2 (Ctrl+P
# imprime, Ctrl+N/O/F/G/R... avales silencieusement) qui empechaient nos
# propres raccourcis de menu de fonctionner -- voir disable_browser_accelerator_keys
# dans lib.rs.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"


# tauri dev compile par defaut en opt-level 0, y compris SQLite (bundled) et
# shakmaty : le recalcul de position_index (millions de parties rejouees) y
# est 10 a 30 fois plus lent qu'en release. On optimise les dependances (une
# seule fois, elles ne recompilent pas a chaque modification) et un peu le
# code du projet.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
